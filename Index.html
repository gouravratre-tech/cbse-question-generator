<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBSE Question Paper Generator — New Syllabus</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <div>
                    <h1>AI Question Paper Generator</h1>
                    <p>CBSE Latest NCF Syllabus | Class 9 & 10</p>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="config-panel">
            <div class="config-grid">
                <div class="field">
                    <label>Select Class</label>
                    <select id="classSelect">
                        <option value="">— Select Class —</option>
                        <option value="9">Class 9 (New NCF Books)</option>
                        <option value="10">Class 10</option>
                    </select>
                </div>
                <div class="field">
                    <label>Select Subject</label>
                    <select id="subjectSelect" disabled>
                        <option value="">— Select Subject —</option>
                    </select>
                </div>
                <div class="field field-full">
                    <label>Chapters <span id="chapterCount"></span></label>
                    <div id="chapterBox" class="chapter-box">
                        <div class="empty-state">Select class & subject first</div>
                    </div>
                </div>
            </div>
            <div class="actions">
                <button id="generateBtn" class="btn btn-primary" disabled><i class="fas fa-wand-magic"></i> Generate Paper</button>
                <button id="regenBtn" class="btn btn-success" style="display:none"><i class="fas fa-sync"></i> New Paper</button>
                <button id="printBtn" class="btn btn-info" style="display:none"><i class="fas fa-print"></i> Print</button>
            </div>
        </section>

        <section id="loader" class="loader-panel" style="display:none">
            <div class="spinner"><i class="fas fa-circle-notch fa-spin"></i></div>
            <h3>Generating your unique paper...</h3>
            <p>Scanning NCERT textbooks and drafting questions.</p>
        </section>

        <section id="paper" class="paper" style="display:none">
            <div class="paper-top">
                <h2>CENTRAL BOARD OF SECONDARY EDUCATION</h2>
                <h3>PRACTICE QUESTION PAPER (AI GENERATED)</h3>
                <div id="paperInfo" class="paper-info"></div>
            </div>
            <div id="paperBody" class="paper-body"></div>
        </section>

        <section id="answers" class="answers-panel" style="display:none">
            <div class="answers-head"><h2>Answer Key</h2></div>
            <div id="answersBody" class="answers-body"></div>
        </section>
        
        <div class="toggle-wrap">
            <button id="toggleAnswers" class="btn btn-warning" style="display:none">Show Answers</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
